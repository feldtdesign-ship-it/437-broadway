<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Canal & Broadway live wall</title>

main figure:first-child{grid-column:span 2} main figure:first-child img{aspect-ratio:352/240}
button{font:inherit;background:transparent;color:#A9A79F;border:1px solid #2B3034;padding:5px 10px;cursor:pointer;letter-spacing:.08em;text-transform:uppercase}
</style></head><body>

<script>
const figs=[...document.querySelectorAll('figure')]; let on=true, n=0;
function refresh(){ const ts=Date.now(); figs.forEach(f=>{ f.querySelector('img').src='https://webcams.nyctmc.org/api/cameras/'+f.dataset.id+'/image?t='+ts; }); document.getElementById('t').textContent='refreshed '+new Date().toLocaleTimeString('en-US',{timeZone:'America/New_York'})+' NYC'; }
refresh(); setInterval(()=>{ if(on) refresh(); }, 20000);
document.getElementById('p').onclick=e=>{ on=!on; e.target.textContent=on?'Pause':'Resume'; };
</script></body></html>
